name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar testes automatizados
        run: pytest -v

  notify:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Notificar no Discord
        run: |
          if [ "${{ needs.test.result }}" == "success" ]; then
            MSG="✅ CI passou em **cpf-cnpj-validator** (commit \`${{ github.sha }}\`, por ${{ github.actor }})"
          else
            MSG="❌ CI falhou em **cpf-cnpj-validator** (commit \`${{ github.sha }}\`, por ${{ github.actor }})"
          fi
          curl -H "Content-Type: application/json" \
               -d "{\"content\": \"$MSG\"}" \
               "${{ secrets.DISCORD_WEBHOOK }}"
